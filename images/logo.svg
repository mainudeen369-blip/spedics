<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" fill="none" role="img" aria-label="SPEDICS Institute">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(0)">
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 170 28;8 170 28;0 170 28" dur="8s" repeatCount="indefinite"/>
      <stop offset="0%" stop-color="#0d7377">
        <animate attributeName="stop-color" values="#0d7377;#14a3a8;#0d7377" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#e8a838">
        <animate attributeName="stop-color" values="#e8a838;#f5c842;#e8a838" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d7377"/>
      <stop offset="100%" stop-color="#14a3a8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="58" y="8" width="268" height="40" rx="20" fill="url(#iconGrad)" opacity="0.06">
    <animate attributeName="opacity" values="0.05;0.11;0.05" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Icon: stylized S + book/leaf -->
  <g filter="url(#glow)">
    <circle cx="28" cy="28" r="24" fill="url(#iconGrad)" opacity="0.15"/>
    <circle cx="28" cy="28" r="21" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.45" stroke-dasharray="16 10">
      <animateTransform attributeName="transform" type="rotate" from="0 28 28" to="360 28 28" dur="12s" repeatCount="indefinite"/>
    </circle>
    <path d="M18 38c0-8 6-14 14-14s14 6 14 14" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M22 22c4-6 12-8 18-4 4 3 4 10 0 14-4 4-12 4-16 0" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="28" cy="20" r="3" fill="#e8a838"/>
    <path d="M28 23v8M24 27h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="34" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="22" font-weight="800" fill="url(#logoGrad)" letter-spacing="1">SPEDICS</text>
  <text x="62" y="48" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="8" font-weight="600" fill="#64748b" letter-spacing="2.2">INSTITUTE OF SKILL DEVELOPMENT</text>
  <rect x="-120" y="8" width="110" height="40" fill="url(#shine)" opacity="0.45">
    <animate attributeName="x" values="-120;360;360" dur="5.8s" repeatCount="indefinite"/>
  </rect>
</svg>
