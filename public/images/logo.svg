<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" fill="none" role="img" aria-label="SPEDICS Institute of Skill Development">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="iconRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f766e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <circle cx="36" cy="36" r="30" fill="url(#iconGrad)" opacity="0.18"/>
    <circle cx="36" cy="36" r="27" stroke="url(#iconRing)" stroke-width="2.5" fill="none"/>
    <path d="M24 44c0-10 5.5-16 12-16s12 6 12 16" stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M27 26c4.5-7 11-9 17-5 4 3.5 4 11-1 15-5 4-12 4-17-1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="36" cy="24" r="4" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
    <path d="M36 28v10M31 33h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="78" y="40" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="30" font-weight="800" fill="url(#logoGrad)" letter-spacing="0.5">SPEDICS</text>
  <text x="78" y="58" font-family="'Plus Jakarta Sans',Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="1.8">INSTITUTE OF SKILL DEVELOPMENT</text>
</svg>
